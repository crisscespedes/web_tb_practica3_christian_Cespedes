<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/styles.css">  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
</head>
<body>
<main>
    <section class ="perfume">
        <img src="images/image-product-desktop.jpg">
    </section>
    <section class="letras">

      <span class="categoria">Perfume</span>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p class="descripcion">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.
      </p>

      <div class="precios">
        <span class="precio-descuento">$149.99</span>
        <span class="precio-real">$169.99</span>
      </div>
     

      <button class="btn-agregar">
        <img src="images/icon-cart.svg" alt="carrito" class="carrito">
        <span>Add to Cart</span>
      </button>
    
    </section>
</main>
 
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
